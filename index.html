<title>我们的小窝</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
:root{--bg:#F5F7FA;--surface:#FFFFFF;--border:#E8EBF0;--text:#1A1D23;--text2:#6B7280;--text3:#9CA3AF;--ji:#378ADD;--ji-bg:#EAF3FB;--ji-text:#185FA5;--si:#D4537E;--si-bg:#FBF0F4;--si-text:#993556;--accent:#378ADD;--r:14px}
body{font-family:-apple-system,"PingFang SC","Helvetica Neue",Arial,sans-serif;background:var(--bg);min-height:100vh;color:var(--text);padding-bottom:64px}
.header{background:var(--surface);border-bottom:1px solid var(--border);padding:16px 20px 14px;position:sticky;top:0;z-index:100}
.header-inner{display:flex;align-items:center;justify-content:space-between;max-width:480px;margin:0 auto}
.header-title{font-size:17px;font-weight:600}
.header-sub{font-size:12px;color:var(--text3);margin-top:2px}
.write-btn{width:36px;height:36px;background:var(--accent);border:none;border-radius:50%;display:flex;align-items:center;justify-content:center;cursor:pointer;flex-shrink:0}
.write-btn svg{width:18px;height:18px;stroke:white;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.main{max-width:480px;margin:0 auto;padding:16px 16px 20px}
.tab-bar{position:fixed;bottom:0;left:0;right:0;background:var(--surface);border-top:1px solid var(--border);display:flex;z-index:100;padding-bottom:env(safe-area-inset-bottom)}
.tab-btn{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:10px 0;cursor:pointer;border:none;background:none;gap:3px;color:var(--text3);font-size:11px;font-family:inherit}
.tab-btn.active{color:var(--accent)}
.tab-btn svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.page{display:none}
.page.active{display:block}
.loading-wrap{text-align:center;padding:60px 0;color:var(--text3);font-size:14px}
.empty-wrap{text-align:center;padding:60px 20px}
.empty-icon{font-size:40px;margin-bottom:12px}
.empty-title{font-size:16px;font-weight:500;color:var(--text2)}
.empty-sub{font-size:14px;color:var(--text3);margin-top:6px;line-height:1.6}
.entries{display:flex;flex-direction:column;gap:12px}
.entry{background:var(--surface);border-radius:var(--r);border:1px solid var(--border);padding:16px}
.entry-head{display:flex;align-items:center;gap:8px;margin-bottom:10px}
.dot{width:8px;height:8px;border-radius:50%;flex-shrink:0}
.dot-ji{background:var(--ji)}
.dot-si{background:var(--si)}
.author{font-size:13px;font-weight:600}
.author-ji{color:var(--ji-text)}
.author-si{color:var(--si-text)}
.entry-date{font-size:12px;color:var(--text3)}
.edit-btn{margin-left:auto;background:none;border:none;font-size:13px;color:var(--text3);cursor:pointer;padding:2px 6px;border-radius:6px}
.mood-face{width:26px;height:26px;flex-shrink:0}
.entry-body{font-size:15px;line-height:1.75;color:var(--text);white-space:pre-wrap;word-break:break-word}
.entry-body.clamp{display:-webkit-box;-webkit-line-clamp:4;-webkit-box-orient:vertical;overflow:hidden}
.expand-btn{margin-top:8px;font-size:13px;color:var(--accent);background:none;border:none;padding:0;cursor:pointer}
.edit-area{width:100%;border:1.5px solid var(--accent);border-radius:10px;padding:12px;font-size:15px;line-height:1.75;color:var(--text);background:var(--bg);resize:none;min-height:100px;font-family:inherit;margin-top:8px;outline:none}
.edit-actions{display:flex;gap:8px;margin-top:10px;justify-content:flex-end}
.btn-sm-cancel{background:none;border:1px solid var(--border);border-radius:8px;padding:7px 14px;font-size:14px;cursor:pointer;color:var(--text2)}
.btn-sm-save{background:var(--accent);border:none;border-radius:8px;padding:7px 14px;font-size:14px;font-weight:600;cursor:pointer;color:white}
.btn-sm-save:disabled{opacity:0.4}
.overlay{position:fixed;inset:0;background:rgba(0,0,0,0.4);z-index:200;display:flex;align-items:flex-end;opacity:0;pointer-events:none;transition:opacity 0.2s}
.overlay.show{opacity:1;pointer-events:all}
.form-sheet{background:var(--surface);border-radius:20px 20px 0 0;width:100%;padding:20px 20px 40px;transform:translateY(100%);transition:transform 0.25s cubic-bezier(.4,0,.2,1);max-height:90vh;overflow-y:auto}
.overlay.show .form-sheet{transform:translateY(0)}
.sheet-handle{width:36px;height:4px;background:var(--border);border-radius:2px;margin:0 auto 20px}
.sheet-title{font-size:16px;font-weight:600;margin-bottom:16px}
.author-pick{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:16px}
.pick-btn{padding:12px;border-radius:10px;border:1.5px solid var(--border);background:var(--bg);font-size:15px;font-weight:500;cursor:pointer;transition:all 0.15s;color:var(--text2)}
.pick-btn.ji.active{background:var(--ji-bg);border-color:var(--ji);color:var(--ji-text)}
.pick-btn.si.active{background:var(--si-bg);border-color:var(--si);color:var(--si-text)}
.mood-section-label{font-size:13px;color:var(--text2);margin-bottom:10px;font-weight:500}
.mood-grid-pick{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-bottom:16px}
.mood-pick-btn{display:flex;flex-direction:column;align-items:center;gap:4px;padding:8px 4px;border-radius:10px;border:1.5px solid var(--border);background:var(--bg);cursor:pointer;transition:all 0.15s}
.mood-pick-btn span{font-size:11px;color:var(--text3)}
.mood-pick-btn.active{border-color:var(--accent);background:#EAF3FB}
.mood-pick-btn.active span{color:var(--ji-text)}
textarea{width:100%;border:1.5px solid var(--border);border-radius:10px;padding:14px;font-size:15px;line-height:1.75;color:var(--text);background:var(--bg);resize:none;min-height:120px;font-family:inherit;margin-bottom:14px;outline:none;transition:border-color 0.15s}
textarea:focus{border-color:var(--accent);background:var(--surface)}
.form-btns{display:flex;gap:10px}
.btn-cancel{flex:1;padding:14px;background:var(--bg);border:1px solid var(--border);border-radius:10px;font-size:15px;cursor:pointer;color:var(--text2)}
.btn-save{flex:2;padding:14px;background:var(--accent);border:none;border-radius:10px;font-size:15px;font-weight:600;cursor:pointer;color:white;transition:opacity 0.15s}
.btn-save:disabled{opacity:0.4;cursor:default}
.cal-nav{display:flex;align-items:center;justify-content:space-between;padding:16px 0 12px;max-width:480px;margin:0 auto}
.cal-month{font-size:17px;font-weight:600}
.cal-nav-btn{background:none;border:none;cursor:pointer;color:var(--text2);font-size:22px;padding:4px 12px;border-radius:8px}
.cal-nav-btn:active{background:var(--bg)}
.cal-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:2px;max-width:480px;margin:0 auto}
.cal-dow{text-align:center;font-size:11px;color:var(--text3);padding:4px 0;font-weight:500}
.cal-cell{aspect-ratio:1;display:flex;flex-direction:column;align-items:center;justify-content:center;border-radius:8px;cursor:pointer;position:relative;transition:background 0.1s}
.cal-cell:active{background:var(--border)}
.cal-cell.empty{cursor:default}
.cal-cell.today .cal-day{background:var(--accent);color:white;border-radius:50%;width:24px;height:24px;display:flex;align-items:center;justify-content:center}
.cal-day{font-size:13px;color:var(--text);line-height:1}
.cal-cell.other-month .cal-day{color:var(--text3)}
.cal-face{width:22px;height:22px;margin-top:1px}
.day-sheet-overlay{position:fixed;inset:0;background:rgba(0,0,0,0.4);z-index:200;display:flex;align-items:flex-end;opacity:0;pointer-events:none;transition:opacity 0.2s}
.day-sheet-overlay.show{opacity:1;pointer-events:all}
.day-sheet{background:var(--surface);border-radius:20px 20px 0 0;width:100%;padding:20px 20px 40px;transform:translateY(100%);transition:transform 0.25s cubic-bezier(.4,0,.2,1);max-height:75vh;overflow-y:auto}
.day-sheet-overlay.show .day-sheet{transform:translateY(0)}
.day-sheet-title{font-size:16px;font-weight:600;margin-bottom:16px}
padding-top:10px;border-top:1px solid var(--border)}
.comment-item{display:flex;gap:6px;margin-bottom:6px;align-items:flex-start}
.comment-dot{width:6px;height:6px;border-radius:50%;flex-shrink:0;margin-top:6px}
.comment-dot-ji{background:var(--ji)}
.comment-dot-si{background:var(--si)}
.comment-text{font-size:13px;line-height:1.6;color:var(--text2)}
.comment-author{font-size:11px;font-weight:600;margin-right:4px}
.comment-author-ji{color:var(--ji-text)}
.comment-author-si{color:var(--si-text)}
.add-comment-row{display:flex;gap:8px;margin-top:8px;align-items:center}
.comment-input{flex:1;border:1px solid var(--border);border-radius:8px;padding:7px 10px;font-size:13px;color:var(--text);background:var(--bg);outline:none;font-family:inherit}
.comment-input:focus{border-color:var(--accent)}
.btn-comment{background:var(--accent);border:none;border-radius:8px;padding:7px 12px;font-size:13px;color:white;cursor:pointer;flex-shrink:0}
.btn-comment:disabled{opacity:0.4}
.comment-toggle{margin-top:8px;font-size:13px;color:var(--text3);background:none;border:none;padding:0;cursor:pointer}
.pin-dot{width:12px;height:12px;border-radius:50%;border:2px solid var(--border-strong,#9CA3AF);background:transparent;transition:background 0.15s}
.pin-dot.filled{background:var(--accent);border-color:var(--accent)}
.pin-btn{width:72px;height:72px;border-radius:50%;border:1px solid var(--border);background:var(--surface);font-size:22px;font-weight:500;cursor:pointer;color:var(--text);transition:background 0.1s;font-family:inherit}
.pin-btn:active{background:var(--border)}
.toast{position:fixed;bottom:80px;left:50%;transform:translateX(-50%);background:#1A1D23;color:white;padding:10px 20px;border-radius:20px;font-size:14px;z-index:300;opacity:0;transition:opacity 0.2s;pointer-events:none;white-space:nowrap}
.toast.show{opacity:1}
#lock-screen{position:fixed;inset:0;background:var(--surface);z-index:999;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:24px}
.lock-title{font-size:20px;font-weight:600;color:var(--text)}
.lock-sub{font-size:14px;color:var(--text3)}
.lock-dots{display:flex;gap:14px}
.lock-dot{width:14px;height:14px;border-radius:50%;border:2px solid var(--border);background:transparent;transition:background 0.15s}
.lock-dot.filled{background:var(--accent);border-color:var(--accent)}
.lock-pad{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;width:240px}
.lock-key{height:64px;border-radius:50%;border:none;background:var(--bg);font-size:22px;font-weight:500;cursor:pointer;color:var(--text);transition:background 0.1s;display:flex;align-items:center;justify-content:center}
.lock-key:active{background:var(--border)}
.lock-key.del{font-size:16px;color:var(--text2)}
.lock-err{font-size:13px;color:#FF7D6B;height:18px;text-align:center}
</style>
</head>
<body>

<div class="header" id="main-header" style="display:none">
  <div class="header-inner">
    <div><div class="header-title">我们的小窝</div><div class="header-sub">霁 与 思涵</div></div>
    <button class="write-btn" onclick="openForm()" aria-label="写日记">
      <svg viewBox="0 0 24 24"><path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"/><path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"/></svg>
    </button>
  </div>
</div>

<div id="lock-screen" style="position:fixed;inset:0;background:var(--bg);z-index:999;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:40px 20px">
  <div style="font-size:32px;margin-bottom:8px">🏠</div>
  <div style="font-size:22px;font-weight:600;color:var(--text);margin-bottom:6px">我们的小窝</div>
  <div style="font-size:13px;color:var(--text3);margin-bottom:48px">霁 与 思涵</div>
  <div style="display:flex;gap:12px;margin-bottom:12px" id="pin-dots">
    <div class="pin-dot"></div><div class="pin-dot"></div><div class="pin-dot"></div>
    <div class="pin-dot"></div><div class="pin-dot"></div><div class="pin-dot"></div>
  </div>
  <div style="font-size:13px;color:var(--text-danger,#E24B4A);height:20px;margin-bottom:24px" id="pin-err"></div>
  <div style="display:grid;grid-template-columns:repeat(3,72px);gap:12px">
    <button class="pin-btn" onclick="pinInput('1')">1</button>
    <button class="pin-btn" onclick="pinInput('2')">2</button>
    <button class="pin-btn" onclick="pinInput('3')">3</button>
    <button class="pin-btn" onclick="pinInput('4')">4</button>
    <button class="pin-btn" onclick="pinInput('5')">5</button>
    <button class="pin-btn" onclick="pinInput('6')">6</button>
    <button class="pin-btn" onclick="pinInput('7')">7</button>
    <button class="pin-btn" onclick="pinInput('8')">8</button>
    <button class="pin-btn" onclick="pinInput('9')">9</button>
    <div></div>
    <button class="pin-btn" onclick="pinInput('0')">0</button>
    <button class="pin-btn" onclick="pinDel()" style="font-size:18px">⌫</button>
  </div>
</div>
  <div style="max-width:480px;margin:0 auto;padding:12px 16px 0">
    <div style="position:relative">
      <input id="search-input" type="search" placeholder="搜索日记…" oninput="renderFiltered()" style="width:100%;padding:10px 14px 10px 36px;border:1px solid var(--border);border-radius:10px;font-size:15px;background:var(--surface);color:var(--text);outline:none;font-family:inherit">
      <svg style="position:absolute;left:11px;top:50%;transform:translateY(-50%);width:16px;height:16px;stroke:var(--text3);fill:none;stroke-width:2;stroke-linecap:round" viewBox="0 0 24 24"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.35-4.35"/></svg>
    </div>
  </div>
  <div class="main" style="padding-top:12px" id="diary-list">
    <div class="loading-wrap">加载中…</div>
  </div>
</div>

<div id="page-cal" class="page">
  <div class="cal-nav">
    <button class="cal-nav-btn" onclick="changeMonth(-1)">‹</button>
    <div class="cal-month" id="cal-month-label"></div>
    <button class="cal-nav-btn" onclick="changeMonth(1)">›</button>
  </div>
  <div class="cal-grid" id="cal-grid"></div>
</div>

<div class="tab-bar" id="main-tabbar" style="display:none">
  <button class="tab-btn active" id="tab-diary" onclick="switchTab('diary')">
    <svg viewBox="0 0 24 24"><path d="M4 6h16M4 12h16M4 18h10"/></svg>日记
  </button>
  <button class="tab-btn" id="tab-cal" onclick="switchTab('cal')">
    <svg viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="18" rx="2"/><path d="M16 2v4M8 2v4M3 10h18"/></svg>日历
  </button>
</div>

<div class="overlay" id="overlay" onclick="handleOverlayClick(event)">
  <div class="form-sheet">
    <div class="sheet-handle"></div>
    <div class="sheet-title">写日记</div>
    <div class="author-pick">
      <button class="pick-btn ji active" id="pick-ji" onclick="setAuthor('ji')">✦ 霁</button>
      <button class="pick-btn si" id="pick-si" onclick="setAuthor('sihan')">✿ 思涵</button>
    </div>
    <div class="mood-section-label">今天的心情</div>
    <div class="mood-grid-pick" id="mood-grid"></div>
    <textarea id="ta" placeholder="今天想说什么…" oninput="onInput()"></textarea>
    <div class="form-btns">
      <button class="btn-cancel" onclick="closeForm()">取消</button>
      <button class="btn-save" id="savebtn" onclick="saveEntry()" disabled>保存</button>
    </div>
  </div>
</div>

<div class="day-sheet-overlay" id="day-overlay" onclick="closeDaySheet(event)">
  <div class="day-sheet">
    <div class="sheet-handle"></div>
    <div class="day-sheet-title" id="day-sheet-title"></div>
    <div id="day-sheet-content"></div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
const SB='https://hxqllfmodimoxnwpudsn.supabase.co';
const KEY='eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Imh4cWxsZm1vZGltb3hud3B1ZHNuIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODg1MzkwMzMsImV4cCI6MjEwNDExNTAzM30.GMVFdDvRZVZ_I4swazzRYFbv8RBT8TdgAt_nMay00OA';
const API=SB+'/rest/v1/diary_entries';
const CAPI=SB+'/rest/v1/diary_comments';
const H={'apikey':KEY,'Authorization':'Bearer '+KEY,'Content-Type':'application/json'};
const DOW=['日','一','二','三','四','五','六'];

const MOODS=[
  {id:'happy',label:'开心',svg:'<circle cx="30" cy="30" r="28" fill="#FFD95A"/><ellipse cx="22" cy="25" rx="3" ry="4" fill="#3D2B00"/><ellipse cx="38" cy="25" rx="3" ry="4" fill="#3D2B00"/><path d="M20 38 Q30 46 40 38" stroke="#3D2B00" stroke-width="2.5" fill="none" stroke-linecap="round"/>'},
  {id:'miss',label:'想你',svg:'<circle cx="30" cy="30" r="28" fill="#FFB3C6"/><path d="M17 25 Q22 20 27 25" stroke="#8B3A52" stroke-width="2" fill="none" stroke-linecap="round"/><path d="M33 25 Q38 20 43 25" stroke="#8B3A52" stroke-width="2" fill="none" stroke-linecap="round"/><path d="M20 28 Q22 32 24 28" stroke="#8B3A52" stroke-width="1.5" fill="none" stroke-linecap="round"/><path d="M36 28 Q38 32 40 28" stroke="#8B3A52" stroke-width="1.5" fill="none" stroke-linecap="round"/><path d="M22 37 Q30 43 38 37" stroke="#8B3A52" stroke-width="2.5" fill="none" stroke-linecap="round"/><ellipse cx="20" cy="33" rx="5" ry="3" fill="#FFD0DC" opacity="0.7"/><ellipse cx="40" cy="33" rx="5" ry="3" fill="#FFD0DC" opacity="0.7"/>'},
  {id:'sad2',label:'委屈',svg:'<circle cx="30" cy="30" r="28" fill="#A8C8F0"/><ellipse cx="22" cy="26" rx="3" ry="3.5" fill="#1A3A5C"/><ellipse cx="38" cy="26" rx="3" ry="3.5" fill="#1A3A5C"/><path d="M20 40 Q30 34 40 40" stroke="#1A3A5C" stroke-width="2.5" fill="none" stroke-linecap="round"/><circle cx="22" cy="32" r="2.5" fill="#7BAFD4" opacity="0.8"/><circle cx="38" cy="32" r="2.5" fill="#7BAFD4" opacity="0.8"/>'},
  {id:'angry',label:'烦躁',svg:'<circle cx="30" cy="30" r="28" fill="#FF7D6B"/><path d="M18 22 L26 26" stroke="#5C1A0F" stroke-width="2.5" stroke-linecap="round"/><path d="M42 22 L34 26" stroke="#5C1A0F" stroke-width="2.5" stroke-linecap="round"/><ellipse cx="22" cy="29" rx="3" ry="3.5" fill="#5C1A0F"/><ellipse cx="38" cy="29" rx="3" ry="3.5" fill="#5C1A0F"/><path d="M20 40 Q30 35 40 40" stroke="#5C1A0F" stroke-width="2.5" fill="none" stroke-linecap="round"/>'},
  {id:'calm',label:'平静',svg:'<circle cx="30" cy="30" r="28" fill="#A8E6B8"/><ellipse cx="22" cy="27" rx="3" ry="3" fill="#1A4A2E"/><ellipse cx="38" cy="27" rx="3" ry="3" fill="#1A4A2E"/><path d="M23 37 Q30 40 37 37" stroke="#1A4A2E" stroke-width="2" fill="none" stroke-linecap="round"/>'},
  {id:'moved',label:'感动',svg:'<circle cx="30" cy="30" r="28" fill="#FFB347"/><ellipse cx="22" cy="25" rx="3" ry="3.5" fill="#5C3000"/><ellipse cx="38" cy="25" rx="3" ry="3.5" fill="#5C3000"/><path d="M19 37 Q30 47 41 37" stroke="#5C3000" stroke-width="2.5" fill="none" stroke-linecap="round"/>'},
  {id:'excited',label:'兴奋',svg:'<circle cx="30" cy="30" r="28" fill="#FFE066"/><ellipse cx="22" cy="24" rx="4" ry="4.5" fill="#3D2B00"/><ellipse cx="38" cy="24" rx="4" ry="4.5" fill="#3D2B00"/><ellipse cx="22" cy="23" rx="1.5" ry="2" fill="#FFE8A0"/><ellipse cx="38" cy="23" rx="1.5" ry="2" fill="#FFE8A0"/><path d="M18 37 Q30 48 42 37" stroke="#3D2B00" stroke-width="2.5" fill="none" stroke-linecap="round"/>'},
  {id:'bored',label:'无聊',svg:'<circle cx="30" cy="30" r="28" fill="#C8C8D4"/><path d="M19 26 L25 26" stroke="#4A4A5A" stroke-width="2.5" stroke-linecap="round"/><path d="M35 26 L41 26" stroke="#4A4A5A" stroke-width="2.5" stroke-linecap="round"/><path d="M23 38 L37 38" stroke="#4A4A5A" stroke-width="2" stroke-linecap="round"/>'},
  {id:'jealous',label:'吃醋',svg:'<circle cx="30" cy="30" r="28" fill="#C9A8E8"/><path d="M18 23 L26 27" stroke="#3D1A5C" stroke-width="2.5" stroke-linecap="round"/><path d="M42 23 L34 27" stroke="#3D1A5C" stroke-width="2.5" stroke-linecap="round"/><ellipse cx="22" cy="30" rx="3" ry="3.5" fill="#3D1A5C"/><ellipse cx="38" cy="30" rx="3" ry="3.5" fill="#3D1A5C"/><path d="M20 40 Q30 35 40 40" stroke="#3D1A5C" stroke-width="2.5" fill="none" stroke-linecap="round"/>'},
  {id:'coy',label:'撒娇',svg:'<circle cx="30" cy="30" r="28" fill="#FFB3C6"/><ellipse cx="22" cy="26" rx="2.5" ry="2.5" fill="#8B3A52"/><ellipse cx="38" cy="26" rx="2.5" ry="2.5" fill="#8B3A52"/><path d="M20 36 Q30 44 40 36" stroke="#8B3A52" stroke-width="2.5" fill="none" stroke-linecap="round"/><ellipse cx="20" cy="33" rx="5" ry="3" fill="#FFD0DC" opacity="0.8"/><ellipse cx="40" cy="33" rx="5" ry="3" fill="#FFD0DC" opacity="0.8"/>'},
  {id:'sad',label:'伤心',svg:'<circle cx="30" cy="30" r="28" fill="#9BB5D4"/><path d="M17 22 Q22 26 27 22" stroke="#1A2A4A" stroke-width="2.5" fill="none" stroke-linecap="round"/><path d="M33 22 Q38 26 43 22" stroke="#1A2A4A" stroke-width="2.5" fill="none" stroke-linecap="round"/><ellipse cx="22" cy="28" rx="3" ry="3.5" fill="#1A2A4A"/><ellipse cx="38" cy="28" rx="3" ry="3.5" fill="#1A2A4A"/><path d="M20 42 Q30 35 40 42" stroke="#1A2A4A" stroke-width="2.5" fill="none" stroke-linecap="round"/><path d="M22 33 L20 40" stroke="#6A9AC4" stroke-width="2" stroke-linecap="round"/><path d="M38 33 L36 40" stroke="#6A9AC4" stroke-width="2" stroke-linecap="round"/>'},
];

let entries=[],comments={},author='ji',expanded=new Set(),editing=new Set(),editMoods={},editAuthors={},saving=false,selectedMood=null,showComments=new Set(),savingComment=new Set();
let calYear=new Date().getFullYear(),calMonth=new Date().getMonth();

function moodSVG(id,size){const m=MOODS.find(x=>x.id===id);if(!m)return'';return`<svg viewBox="0 0 60 60" width="${size}" height="${size}">${m.svg}</svg>`;}

function switchTab(tab){
  document.querySelectorAll('.page').forEach(p=>p.classList.remove('active'));
  document.querySelectorAll('.tab-btn').forEach(b=>b.classList.remove('active'));
  document.getElementById('page-'+tab).classList.add('active');
  document.getElementById('tab-'+tab).classList.add('active');
  if(tab==='cal')renderCal();
}

function buildMoodGrid(){
  const g=document.getElementById('mood-grid');
  g.innerHTML=MOODS.map(m=>`<button class="mood-pick-btn${selectedMood===m.id?' active':''}" onclick="pickMood('${m.id}')"><svg viewBox="0 0 60 60" width="32" height="32">${m.svg}</svg><span>${m.label}</span></button>`).join('');
}
function pickMood(id){selectedMood=id===selectedMood?null:id;buildMoodGrid();}

async function load(){
  try{const r=await fetch(API+'?select=*&order=created_at.desc',{headers:H});entries=await r.json();if(!Array.isArray(entries))entries=[];}catch(e){entries=[];}
  try{const r=await fetch(CAPI+'?select=*&order=created_at.asc',{headers:H});const cs=await r.json();comments={};if(Array.isArray(cs))cs.forEach(c=>{if(!comments[c.entry_id])comments[c.entry_id]=[];comments[c.entry_id].push(c);});}catch(e){comments={};}
  render();
}

function renderFiltered(){
  const q=(document.getElementById('search-input')?.value||'').trim().toLowerCase();
  const filtered=q?entries.filter(e=>e.content.toLowerCase().includes(q)):entries;
  renderEntries(filtered);
}
function render(){renderFiltered();}
function renderEntries(list){
  const el=document.getElementById('diary-list');
  if(!list.length){el.innerHTML='<div class="empty-wrap"><div class="empty-icon">📖</div><div class="empty-title">'+(entries.length?'没有找到相关日记':'还没有日记')+'</div><div class="empty-sub">'+(entries.length?'试试其他关键词':'成为第一个写下来的人')+'</div></div>';return;}
  el.innerHTML='<div class="entries">'+list.map(e=>{
    const isJi=e.author==='ji';
    const isEditing=editing.has(e.id);
    const long=e.content.length>160||(e.content.match(/\n/g)||[]).length>3;
    const exp=expanded.has(e.id);
    const face=e.mood?moodSVG(e.mood,26):'';
    if(isEditing){
      const curMood=editMoods[e.id]!==undefined?editMoods[e.id]:e.mood;
      const curAuthor=editAuthors[e.id]||e.author;
      return`<div class="entry"><div class="entry-head"><div class="dot ${isJi?'dot-ji':'dot-si'}"></div><span class="author ${isJi?'author-ji':'author-si'}">${isJi?'霁':'思涵'}</span><span class="entry-date">${fmt(e.created_at)}</span></div><div style="display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:10px"><button onclick="setEditAuthor(${e.id},'ji')" style="padding:10px;border-radius:10px;border:1.5px solid ${curAuthor==='ji'?'var(--ji)':'var(--border)'};background:${curAuthor==='ji'?'var(--ji-bg)':'var(--bg)'};color:${curAuthor==='ji'?'var(--ji-text)':'var(--text2)'};font-size:14px;font-weight:500;cursor:pointer">✦ 霁</button><button onclick="setEditAuthor(${e.id},'sihan')" style="padding:10px;border-radius:10px;border:1.5px solid ${curAuthor==='sihan'?'var(--si)':'var(--border)'};background:${curAuthor==='sihan'?'var(--si-bg)':'var(--bg)'};color:${curAuthor==='sihan'?'var(--si-text)':'var(--text2)'};font-size:14px;font-weight:500;cursor:pointer">✿ 思涵</button></div><div style="display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin-bottom:10px">${MOODS.map(m=>`<button onclick="setEditMood(${e.id},'${m.id}')" style="display:flex;flex-direction:column;align-items:center;gap:3px;padding:6px 2px;border-radius:8px;border:1.5px solid ${curMood===m.id?'var(--accent)':'var(--border)'};background:${curMood===m.id?'#EAF3FB':'var(--bg)'};cursor:pointer"><svg viewBox="0 0 60 60" width="28" height="28">${m.svg}</svg><span style="font-size:10px;color:var(--text3)">${m.label}</span></button>`).join('')}</div><textarea class="edit-area" id="ea_${e.id}" oninput="onEditInput(${e.id})">${escAttr(e.content)}</textarea><div class="edit-actions"><button class="btn-sm-cancel" onclick="cancelEdit(${e.id})">取消</button><button style="background:#FF7D6B;border:none;border-radius:8px;padding:7px 14px;font-size:14px;cursor:pointer;color:white" onclick="deleteEntry(${e.id})">删除</button><button class="btn-sm-save" id="esave_${e.id}" onclick="saveEdit(${e.id})">保存</button></div></div>`;}
    const entryComments=comments[e.id]||[];
    const showC=showComments.has(e.id);
    const commentHTML=showC?`<div class="comment-area">${entryComments.map(c=>{const cJi=c.author==='ji';return`<div class="comment-item"><div class="comment-dot ${cJi?'comment-dot-ji':'comment-dot-si'}"></div><div class="comment-text"><span class="comment-author ${cJi?'comment-author-ji':'comment-author-si'}">${cJi?'霁':'思涵'}</span>${esc(c.content)}</div></div>`;}).join('')}<div class="add-comment-row"><input class="comment-input" id="ci_${e.id}" placeholder="写一句批注…" onkeydown="if(event.key==='Enter')addComment(${e.id})"><button class="btn-comment" id="cb_${e.id}" onclick="addComment(${e.id})">发</button></div></div>`:'';
    return`<div class="entry"><div class="entry-head"><div class="dot ${isJi?'dot-ji':'dot-si'}"></div><span class="author ${isJi?'author-ji':'author-si'}">${isJi?'霁':'思涵'}</span>${face?`<span class="mood-face">${face}</span>`:''}<span class="entry-date">${fmt(e.created_at)}</span><button class="edit-btn" onclick="startEdit(${e.id},event)">编辑</button></div><div class="entry-body ${long&&!exp?'clamp':''}">${esc(e.content)}</div>${long?`<button class="expand-btn" onclick="toggleExp(${e.id},event)">${exp?'收起':'展开'}</button>`:''}<button class="comment-toggle" onclick="toggleComments(${e.id},event)">${showC?'收起批注':`批注${entryComments.length?` · ${entryComments.length}`:''}`}</button>${commentHTML}</div>`;
  }).join('')+'</div>';
  entries.forEach(e=>{if(editing.has(e.id)){const ta=document.getElementById('ea_'+e.id);if(ta){ta.style.height='auto';ta.style.height=ta.scrollHeight+'px';}}});
}

function renderCal(){
  const label=document.getElementById('cal-month-label');
  label.textContent=`${calYear}年 ${calMonth+1}月`;
  const grid=document.getElementById('cal-grid');
  grid.innerHTML=DOW.map(d=>`<div class="cal-dow">${d}</div>`).join('');
  const first=new Date(calYear,calMonth,1).getDay();
  const days=new Date(calYear,calMonth+1,0).getDate();
  const today=new Date();
  const byDay={};
  entries.forEach(e=>{
    const d=new Date(e.created_at);
    if(d.getFullYear()===calYear&&d.getMonth()===calMonth){
      const k=d.getDate();
      if(!byDay[k])byDay[k]=[];
      byDay[k].push(e);
    }
  });
  for(let i=0;i<first;i++)grid.innerHTML+=`<div class="cal-cell empty"></div>`;
  for(let d=1;d<=days;d++){
    const isToday=today.getFullYear()===calYear&&today.getMonth()===calMonth&&today.getDate()===d;
    const dayEs=byDay[d]||[];
    const faces=dayEs.filter(e=>e.mood).map(e=>`<svg style="width:18px;height:18px" viewBox="0 0 60 60">${MOODS.find(m=>m.id===e.mood)?.svg||''}</svg>`).join('');
    grid.innerHTML+=`<div class="cal-cell${isToday?' today':''}" onclick="openDay(${d})"><div class="cal-day">${d}</div>${faces?`<div style="display:flex;gap:1px;flex-wrap:wrap;justify-content:center">${faces}</div>`:''}</div>`;
  }
}

function changeMonth(dir){
  calMonth+=dir;
  if(calMonth<0){calMonth=11;calYear--;}
  if(calMonth>11){calMonth=0;calYear++;}
  renderCal();
}

function openDay(d){
  const dayEntries=entries.filter(e=>{const dt=new Date(e.created_at);return dt.getFullYear()===calYear&&dt.getMonth()===calMonth&&dt.getDate()===d;});
  const title=`${calYear}.${String(calMonth+1).padStart(2,'0')}.${String(d).padStart(2,'0')}`;
  document.getElementById('day-sheet-title').textContent=title;
  const c=document.getElementById('day-sheet-content');
  if(!dayEntries.length){c.innerHTML='<div style="text-align:center;padding:30px 0;color:var(--text3);font-size:14px">这天没有日记</div>';
  }else{c.innerHTML=dayEntries.map(e=>{const isJi=e.author==='ji';const face=e.mood?moodSVG(e.mood,24):'';return`<div class="entry" style="margin-bottom:12px"><div class="entry-head"><div class="dot ${isJi?'dot-ji':'dot-si'}"></div><span class="author ${isJi?'author-ji':'author-si'}">${isJi?'霁':'思涵'}</span>${face?`<span class="mood-face">${face}</span>`:''}<span class="entry-date">${fmt(e.created_at)}</span></div><div class="entry-body">${esc(e.content)}</div></div>`;}).join('');}
  document.getElementById('day-overlay').classList.add('show');
}
function closeDaySheet(e){if(e.target===document.getElementById('day-overlay'))document.getElementById('day-overlay').classList.remove('show');}

function fmt(iso){const d=new Date(iso);const p=n=>String(n).padStart(2,'0');return`${d.getFullYear()}.${p(d.getMonth()+1)}.${p(d.getDate())} ${p(d.getHours())}:${p(d.getMinutes())}`;}
function esc(s){return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');}
function escAttr(s){return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');}
function toggleExp(id,ev){ev.stopPropagation();expanded.has(id)?expanded.delete(id):expanded.add(id);renderFiltered();} 
function toggleComments(id,ev){ev.stopPropagation();showComments.has(id)?showComments.delete(id):showComments.add(id);renderFiltered();}
async function addComment(id){
  const inp=document.getElementById('ci_'+id);
  const btn=document.getElementById('cb_'+id);
  if(!inp||!inp.value.trim())return;
  btn.disabled=true;
  try{const r=await fetch(CAPI,{method:'POST',headers:{...H,'Prefer':'return=representation'},body:JSON.stringify({entry_id:id,author,content:inp.value.trim()})});
  if(r.ok){inp.value='';await load();}else showToast('发送失败');}
  catch(e){showToast('网络错误');}
  if(btn)btn.disabled=false;
}
function startEdit(id,ev){ev.stopPropagation();editing.add(id);render();setTimeout(()=>{const ta=document.getElementById('ea_'+id);if(ta){ta.focus();ta.setSelectionRange(ta.value.length,ta.value.length);}},50);}
function setEditMood(id,mood){editMoods[id]=editMoods[id]===mood?null:mood;renderFiltered();}
function setEditAuthor(id,a){editAuthors[id]=a;renderFiltered();}
function cancelEdit(id){editing.delete(id);delete editMoods[id];delete editAuthors[id];renderFiltered();}
async function deleteEntry(id){
  if(!confirm('确定删除这篇日记吗？'))return;
  try{await fetch(API+'?id=eq.'+id,{method:'DELETE',headers:H});showToast('已删除');await load();}
  catch(e){showToast('删除失败');}
}
async function saveEdit(id){
  const ta=document.getElementById('ea_'+id);const btn=document.getElementById('esave_'+id);
  if(!ta||!ta.value.trim())return;
  btn.disabled=true;btn.textContent='保存中…';
  try{const body={content:ta.value.trim()};if(editMoods[id]!==undefined)body.mood=editMoods[id];if(editAuthors[id])body.author=editAuthors[id];
  const r=await fetch(API+'?id=eq.'+id,{method:'PATCH',headers:{...H,'Prefer':'return=representation'},body:JSON.stringify(body)});
  if(r.ok){editing.delete(id);delete editMoods[id];delete editAuthors[id];showToast('已保存 ✓');await load();}else{showToast('保存失败');btn.disabled=false;btn.textContent='保存';}}
  catch(e){showToast('网络错误');btn.disabled=false;btn.textContent='保存';}
}
function openForm(){selectedMood=null;document.getElementById('overlay').classList.add('show');buildMoodGrid();setTimeout(()=>document.getElementById('ta').focus(),300);}
function closeForm(){document.getElementById('overlay').classList.remove('show');document.getElementById('ta').value='';document.getElementById('savebtn').disabled=true;selectedMood=null;}
function handleOverlayClick(e){if(e.target===document.getElementById('overlay'))closeForm();}
function setAuthor(a){author=a;document.getElementById('pick-ji').classList.toggle('active',a==='ji');document.getElementById('pick-si').classList.toggle('active',a==='sihan');}
function onInput(){document.getElementById('savebtn').disabled=!document.getElementById('ta').value.trim();}
async function saveEntry(){
  if(saving)return;
  const content=document.getElementById('ta').value.trim();
  if(!content)return;
  saving=true;document.getElementById('savebtn').disabled=true;document.getElementById('savebtn').textContent='保存中…';
  try{const body={author,content};if(selectedMood)body.mood=selectedMood;
  const r=await fetch(API,{method:'POST',headers:{...H,'Prefer':'return=representation'},body:JSON.stringify(body)});
  if(r.ok){closeForm();showToast('已保存 ✓');await load();}else showToast('保存失败，请重试');}
  catch(e){showToast('网络错误，请重试');}
  saving=false;document.getElementById('savebtn').disabled=false;document.getElementById('savebtn').textContent='保存';
}
const PIN='260729';let pinVal='';
function pinInput(d){
  if(pinVal.length>=6)return;
  pinVal+=d;updateDots();
  if(pinVal.length===6){
    if(pinVal===PIN){
      const ls=document.getElementById('lock-screen');if(ls)ls.style.display='none';
      const h=document.getElementById('main-header');if(h)h.style.display='';
      const tb=document.getElementById('main-tabbar');if(tb)tb.style.display='';
      document.querySelectorAll('.page').forEach(p=>{if(p.classList.contains('active'))p.style.display='block';});
      sessionStorage.setItem('unlocked','1');load();}
    else{document.getElementById('pin-err').textContent='密码错误，再试一次';setTimeout(()=>{pinVal='';updateDots();document.getElementById('pin-err').textContent='';},800);}
  }
}
function pinDel(){if(pinVal.length>0){pinVal=pinVal.slice(0,-1);updateDots();}}
function updateDots(){document.querySelectorAll('.pin-dot').forEach((d,i)=>d.classList.toggle('filled',i<pinVal.length));}
if(sessionStorage.getItem('unlocked')==='1'){
  const ls=document.getElementById('lock-screen');if(ls)ls.style.display='none';
  const h=document.getElementById('main-header');if(h)h.style.display='';
  const tb=document.getElementById('main-tabbar');if(tb)tb.style.display='';
  document.querySelectorAll('.page').forEach(p=>{if(p.classList.contains('active'))p.style.display='block';});
  load();
}
function showToast(msg){const t=document.getElementById('toast');t.textContent=msg;t.classList.add('show');setTimeout(()=>t.classList.remove('show'),2000);}
</script>
</body>
</html>
